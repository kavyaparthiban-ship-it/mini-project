# Application tests use H2 so they can run without MySQL
spring.datasource.url=jdbc:h2:mem:crowdsense-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

crowdsense.cors.allowed-origins=http://localhost:5500
crowdsense.crowd.threshold-moderate=40
crowdsense.crowd.threshold-high=65
crowdsense.crowd.threshold-critical=85
crowdsense.crowd.stale-after-minutes=720
crowdsense.recommendation.weight-crowd=0.40
crowdsense.recommendation.weight-wait=0.20
crowdsense.recommendation.weight-travel=0.20
crowdsense.recommendation.weight-walk=0.20
crowdsense.waiting.avg-headway-minutes=12
crowdsense.travel.avg-speed-kmph=20
crowdsense.reward.points=5
crowdsense.reward.min-crowd-improvement-percent=15
