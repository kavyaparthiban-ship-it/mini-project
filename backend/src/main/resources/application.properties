# =============================================================================
# CrowdSense backend configuration (MySQL)
# -----------------------------------------------------------------------------
# Secrets are NOT stored here.  Provide DB_USERNAME / DB_PASSWORD through
# environment variables, or create backend/src/main/resources/application-local.properties
# (which is git-ignored) to override these defaults for your machine.
# See .env.example in the repository root.
# =============================================================================
server.port=${SERVER_PORT:8080}

spring.application.name=crowdsense

# --- Data source -----------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crowdsense?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Fail fast and loudly when MySQL is unavailable instead of pretending data loaded
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.connection-timeout=5000

# --- JPA / Hibernate -------------------------------------------------------
# The schema and seed data are owned by database/schema.sql and database/data.sql.
# Hibernate is configured to validate the mapping, not to create tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- Application settings --------------------------------------------------
# Comma separated list of origins allowed to call the API (local frontend).
crowdsense.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000}

# Crowd category thresholds (occupancy percentage).  Must stay ordered:
# critical >= high >= moderate >= 0
crowdsense.crowd.threshold-moderate=${CROWD_THRESHOLD_MODERATE:40}
crowdsense.crowd.threshold-high=${CROWD_THRESHOLD_HIGH:65}
crowdsense.crowd.threshold-critical=${CROWD_THRESHOLD_CRITICAL:85}

# Occupancy older than this (minutes) is treated as STALE, never as empty.
crowdsense.crowd.stale-after-minutes=${CROWD_STALE_MINUTES:720}

# Recommendation scoring weights (must sum to 1.0 for interpretable scores).
crowdsense.recommendation.weight-crowd=${REC_WEIGHT_CROWD:0.40}
crowdsense.recommendation.weight-wait=${REC_WEIGHT_WAIT:0.20}
crowdsense.recommendation.weight-travel=${REC_WEIGHT_TRAVEL:0.20}
crowdsense.recommendation.weight-walk=${REC_WEIGHT_WALK:0.20}

# Waiting-time estimation: minutes of headway per bus on a route.
crowdsense.waiting.avg-headway-minutes=${WAITING_HEADWAY:12}

# Average in-service speed used to convert distance to travel time.
crowdsense.travel.avg-speed-kmph=${TRAVEL_SPEED:20}

# --- Rewards ---------------------------------------------------------------
crowdsense.reward.points=${REWARD_POINTS:5}
# A reward is given only when the chosen alternative is at least this much
# less crowded than the bus the passenger would otherwise have taken.
crowdsense.reward.min-crowd-improvement-percent=${REWARD_MIN_IMPROVEMENT:15}

# --- Logging ---------------------------------------------------------------
logging.level.com.crowdsense=INFO
